name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "biome.json"
      - "config.example.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build pages
        run: npm run build

      - name: Publish pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
